name: Build Microsoft Store Package

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-store:
    name: Build Microsoft Store app package
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install desktop dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Typecheck backend
        run: npm --prefix backend run typecheck

      - name: Build Microsoft Store package
        run: npm run desktop:store
        env:
          WINDOWS_STORE_IDENTITY_NAME: ${{ vars.WINDOWS_STORE_IDENTITY_NAME || secrets.WINDOWS_STORE_IDENTITY_NAME }}
          WINDOWS_STORE_APPLICATION_ID: ${{ vars.WINDOWS_STORE_APPLICATION_ID || secrets.WINDOWS_STORE_APPLICATION_ID }}
          WINDOWS_STORE_PUBLISHER: ${{ vars.WINDOWS_STORE_PUBLISHER || secrets.WINDOWS_STORE_PUBLISHER }}
          WINDOWS_STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.WINDOWS_STORE_PUBLISHER_DISPLAY_NAME || secrets.WINDOWS_STORE_PUBLISHER_DISPLAY_NAME }}
          WINDOWS_STORE_DISPLAY_NAME: ${{ vars.WINDOWS_STORE_DISPLAY_NAME || secrets.WINDOWS_STORE_DISPLAY_NAME }}

      - name: Upload Store package artifact
        uses: actions/upload-artifact@v5
        with:
          name: career-signal-store-package
          path: |
            release/*.appx
            release/*.appxupload
            release/*.msix
            release/*.msixupload
          if-no-files-found: error
