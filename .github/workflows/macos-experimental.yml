name: Build Experimental macOS Desktop App

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish assets to, for example v1.0.8.2"
        required: false
        type: string

permissions:
  contents: write

jobs:
  macos-desktop:
    name: Build unsigned macOS app
    runs-on: macos-latest

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install desktop dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Typecheck backend
        run: npm --prefix backend run typecheck

      - name: Build experimental macOS desktop app
        run: npm run desktop:dist:mac

      - name: Upload unsigned macOS artifacts
        uses: actions/upload-artifact@v6
        with:
          name: career-signal-macos-experimental
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-mac.yml
          if-no-files-found: error

      - name: Publish unsigned macOS files to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-mac.yml
